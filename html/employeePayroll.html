<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payroll Form</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/employeePayrool.css">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script defer src="../js/employeePayrool.js"></script>
</head>
<body>
    <div class="header">
        <img src="../assets/logo.jpeg" alt="Company Logo">
        <a href="employeeDetails.html" style="text-decoration: none; color: inherit;">
            <h1>Employee Payroll</h1>
        </a>
    </div>

    <div class="container">
        <h2>Employee Payroll Form</h2>
        <form id="employee-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter employee name" required />
            </div>

            <div class="form-group profile-image-group">
                <label>Profile Image</label>
                <input type="radio" name="profileImage" value="../assets/p1.jpeg" id="p1" required />
                <label for="p1"><img src="../assets/p1.jpeg" alt="Profile Image 1"></label>

                <input type="radio" name="profileImage" value="../assets/p2.jpeg" id="p2" required />
                <label for="p2"><img src="../assets/p2.jpeg" alt="Profile Image 2"></label>

                <input type="radio" name="profileImage" value="../assets/p3.jpeg" id="p3" required />
                <label for="p3"><img src="../assets/p3.jpeg" alt="Profile Image 3"></label>

                <input type="radio" name="profileImage" value="../assets/p4.jpeg" id="p4" required />
                <label for="p4"><img src="../assets/p4.jpeg" alt="Profile Image 4"></label>
            </div>

            <div class="form-group gender-group">
                <label>Gender</label>
                <input type="radio" name="gender" value="Male" id="male" required /> Male
                <input type="radio" name="gender" value="Female" id="female" required /> Female
            </div>

            <div class="form-group department-group">
                <label>Departments</label>
                <input type="checkbox" name="department" value="Sales" id="sales" /> Sales
                <input type="checkbox" name="department" value="HR" id="hr" /> HR
                <input type="checkbox" name="department" value="Finance" id="finance" /> Finance
            </div>

            <div class="form-group date-group">
                <label>Start Date</label>
                <input type="number" id="startDay" placeholder="DD" required min="1" max="31" />
                <input type="number" id="startMonth" placeholder="MM" required min="1" max="12" />
                <input type="number" id="startYear" placeholder="YYYY" required min="1900" max="2100" />
            </div>

            <div class="form-group salary-group">
                <label for="salary">Salary</label>
                <select id="salary" required>
                    <option value="">Select Salary</option>
                    <option value="50000">50,000</option>
                    <option value="60000">60,000</option>
                    <option value="70000">70,000</option>
                    <option value="80000">80,000</option>
                    <option value="90000">90,000</option>
                </select>
            </div>

            <div class="form-group notes-group">
                <label for="notes">Notes</label>
                <textarea id="notes" placeholder="Enter any additional notes here..."></textarea>
            </div>

            <div class="button-group">
                <button type="button" class="cancel-btn" onclick="window.location.href = 'employeeDetails.html'">Cancel</button>
                <button type="submit" id="submit-btn">Submit</button>
                <button type="reset" id="reset-btn">Reset</button>
            </div>
        </form>
    </div>
</body>
</html>
